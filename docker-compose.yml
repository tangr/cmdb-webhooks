services:
  # Main FastAPI application
  webhook-proxy:
    build:
      context: .
      platforms:
        - linux/amd64    # Linux x86_64
        - linux/arm64    # Apple Silicon 和 Linux ARM64
    ports:
      - "8000:8000"
    environment:
      - UVICORN_PORT=8000
      - UVICORN_HOST=0.0.0.0
      - DATABASE_URL=mysql+pymysql://root:rootpass@mysql:3306/webhook_proxy
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=13
      - REDIS_PASSWORD=
      - SESSION_REDIS_KEY_PREFIX="session:"
      - LOG_LEVEL=INFO
      - DATABASE_ECHO=false
      - ENABLE_USERNAME_PASSWORD_LOGIN=false
      - ENABLE_OIDC_LOGIN=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  # MySQL database
  mysql:
    image: mysql:8.0.42
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=webhook_proxy
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppass
    ports:
      - "3306:3306"
    volumes:
      - ${WEBHOOK_PROXY_DATA_DIR}/mysql_data:/var/lib/mysql
      - ./sql/db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for session storage
  redis:
    image: redis:7.2.10-bookworm
    ports:
      - "6379:6379"
    volumes:
      - ${WEBHOOK_PROXY_DATA_DIR}/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
