# Amis Jenkins Form to Jenkins Job Mapping Configuration
# This file defines Amis forms and their corresponding Jenkins job configurations

# =============================================================================
# Global Jenkins Configuration
# =============================================================================
jenkins_base_url: "https://jenkins.example.com"  # Jenkins server URL
jenkins_default_token: ""  # Default trigger token for Generic Webhook Trigger
jenkins_default_user: ""   # Default Jenkins user for Remote API
jenkins_default_api_token: ""  # Default Jenkins API token for Remote API

# =============================================================================
# User to Feishu ID Mapping (for approval feature)
# =============================================================================
# Maps system username to Feishu user ID (short format)
# Used when approval is enabled for a form
user_feishu_mapping:
  # admin: "ce39af4f"
  # john: "abc12345"
  tangshoubin: ce39af4f

# =============================================================================
# Form Definitions
# =============================================================================
# Each form has:
#   - title: Display name of the form
#   - description: Brief description of what the form does
#   - jenkins_job: Jenkins job path (e.g., "folder/job-name")
#   - trigger_type: "generic_webhook" or "remote_api"
#   - jenkins_token: Token for Generic Webhook Trigger (optional, uses default)
#   - jenkins_user: Jenkins user for Remote API (optional, uses default)
#   - jenkins_api_token: Jenkins API token for Remote API (optional, uses default)
#   - jenkins_base_url: Override global Jenkins URL (optional)
#   - approval: Feishu approval config (optional)
#       - enabled: true/false to enable/disable approval
#       - feishu_app: Feishu app name from feishu_approval_config.yaml
#       - approval_code: Override default approval code (optional)
#       - form_data_template: Mapping of Feishu widget IDs to form data (optional)
#           Example: {"widget-id1": "Form: {form_title}\nJob: {jenkins_job}", "widget-id2": "{request_params_json}"}
#           Available placeholders: {form_id}, {form_title}, {jenkins_job}, {username}, {request_params_json}, {field_name}
#       - modifiable_fields: List of fields that can be modified after approval (optional)
#           Example: ["environment", "comment"]
#           These fields' options will be saved at submission time
#       - max_executions: Maximum number of executions allowed (0 = unlimited, default: 0)
#       - expire_hours: Hours until approval expires (0 = never, default: 0)
#   - permissions: Form-level access control (optional)
#       - allowed_roles: Roles that can view + submit the form (primary)
#       - allowed_users: Users that can view + submit the form (supplementary)
#       - execute_roles: Roles that can execute pending jobs (extends default: submitter + admin)
#       - execute_users: Users that can execute pending jobs (extends default: submitter + admin)
#       Note: admin role always has full access. No permissions block = admin-only.
#   - schema: Amis form schema (JSON/YAML format)
#
# =============================================================================

forms:
  # Example 1: Deploy Application (Generic Webhook Trigger)
  deploy-app:
    title: "Deploy Application"
    description: "Deploy application to specified environment"
    permissions:
      allowed_roles: ["jenkins-form-role1"]
    jenkins_job: "deploy/app-deploy"
    trigger_type: "generic_webhook"
    jenkins_token: "deploy-token"
    schema:
      type: "page"
      title: "Deploy Application"
      body:
        type: "form"
        api:
          method: "post"
          url: "/amis-jenkins/api/submit/deploy-app"
        body:
          - type: "input-text"
            name: "branch"
            label: "Branch Name"
            required: true
            placeholder: "e.g., main, develop, feature/xxx"
          - type: "select"
            name: "environment"
            label: "Deploy Environment"
            required: true
            options:
              - label: "Development"
                value: "dev"
              - label: "Staging"
                value: "staging"
              - label: "Production"
                value: "prod"
          - type: "input-text"
            name: "version"
            label: "Version Tag"
            placeholder: "Optional, e.g., v1.0.0"

  # Example 2: Build Docker Image (Remote API)
  build-image:
    title: "Build Docker Image"
    description: "Build and push Docker image to registry"
    permissions:
      allowed_roles: ["jenkins-form-role1"]
    jenkins_job: "pipelines/build-image"
    trigger_type: "remote_api"
    # Optional: override global Jenkins config for this form
    # jenkins_base_url: "https://jenkins-prod.example.com"
    jenkins_user: "admin"
    jenkins_api_token: "your-api-token"
    schema:
      type: "page"
      title: "Build Docker Image"
      body:
        type: "form"
        api:
          method: "post"
          url: "/amis-jenkins/api/submit/build-image"
        body:
          - type: "input-text"
            name: "image_name"
            label: "Image Name"
            required: true
            placeholder: "e.g., myapp"
          - type: "input-text"
            name: "tag"
            label: "Image Tag"
            value: "latest"
            required: true
          - type: "input-text"
            name: "git_repo"
            label: "Git Repository URL"
            required: true
            placeholder: "e.g., https://github.com/org/repo.git"
          - type: "input-text"
            name: "git_branch"
            label: "Git Branch"
            value: "main"
          - type: "textarea"
            name: "build_args"
            label: "Build Arguments"
            placeholder: "Optional, one per line (KEY=VALUE)"

  # Example 3: Run Tests (Generic Webhook with multiple options)
  run-tests:
    title: "Run Tests"
    description: "Execute test suite on specified branch"
    permissions:
      allowed_roles: ["jenkins-form-role1"]
    jenkins_job: "ci/run-tests"
    trigger_type: "generic_webhook"
    jenkins_token: "test-token"
    schema:
      type: "page"
      title: "Run Tests"
      body:
        type: "form"
        api:
          method: "post"
          url: "/amis-jenkins/api/submit/run-tests"
        body:
          - type: "input-text"
            name: "branch"
            label: "Branch Name"
            required: true
          - type: "checkboxes"
            name: "test_types"
            label: "Test Types"
            options:
              - label: "Unit Tests"
                value: "unit"
              - label: "Integration Tests"
                value: "integration"
              - label: "E2E Tests"
                value: "e2e"
          - type: "switch"
            name: "verbose"
            label: "Verbose Output"
            value: false

  deploy-test1a:
    title: "Deploy test1a"
    description: "Deploy test1a for development"
    permissions:
      allowed_roles: ["jenkins-form-role1"]
    jenkins_base_url: "https://jenkins-dev1.exodushk.com"
    # jenkins_base_url: "https://echoserver-test.exodushk.com"
    jenkins_job: "pipelines/pipeline-k8s-image-deploy-noinput"
    trigger_type: "generic_webhook"
    jenkins_token: "pipeline-k8s-image-deploy-noinput-trigger-token1"
    # Feishu approval configuration (optional)
    approval:
      enabled: true
      feishu_app: "yax-tmptest1"  # Must match app name in feishu_approval_config.yaml
      # approval_code: "xxx"  # Optional: override default approval code
      # form_data_template maps Feishu widget IDs to values
      # Available placeholders: {form_id}, {form_title}, {jenkins_job}, {username}, {request_params_json}, {field_name}
      form_data_template:
        widget-id1: "表单: {form_title}\nJenkins任务: {jenkins_job}\n提交人: {username}"
        widget-id2: "项目: {project}\n环境: {environment}\n服务: {service}"
        widget-id3: "镜像Tag: {image_tag}\n备注: {comment}"
        widget-id4: "完整参数:\n{request_params_json}"
      # Multi-execution settings
      modifiable_fields: ["environment", "comment"]  # Fields that can be modified after approval
      max_executions: 0  # 0 = unlimited
      expire_hours: 0    # 0 = never expires
    schema:
      type: "page"
      title: "Deploy test1a"
      body:
        type: "form"
        api:
          method: "post"
          url: "/amis-jenkins/api/submit/deploy-test1a"
          messages:
            success: "提交成功"
        actions:
          - type: "submit"
            label: "提交1a"
            level: "primary"
            confirmText: "确认要提交此表单1a吗？"
        body:
          - type: "select"
            name: "project"
            label: "Deploy Project"
            required: true
            options:
              - label: "Exodus"
                value: "exodus"
              - label: "AMS"
                value: "ams"
              - label: "Wallet"
                value: "wallet"
              - label: "Infra"
                value: "infra"
          - type: "select"
            name: "environment"
            label: "Deploy Environment"
            required: true
            options:
              - label: "aws1"
                value: "aws1"
                visibleOn: "data.project == 'exodus' || data.project == 'wallet'"
              - label: "aws2"
                value: "aws2"
                visibleOn: "data.project == 'exodus' || data.project == 'wallet'"
              - label: "txhk"
                value: "txhk"
                visibleOn: "data.project == 'exodus' || data.project == 'wallet'"
              - label: "txg"
                value: "txg"
                visibleOn: "data.project == 'exodus' || data.project == 'wallet'"
          - type: "select"
            name: "service"
            label: "Deploy Service"
            required: true
            options:
              - label: "dev/account-server"
                value: "dev/account-server"
                visibleOn: "data.project == 'exodus' || data.project == 'wallet'"
              - label: "exodus/dev/risk-engine-api"
                value: "exodus/dev/risk-engine-api"
                visibleOn: "data.project == 'exodus' || data.project == 'wallet'"
          - type: "select"
            name: "image_tag"
            label: "Image Tag"
            placeholder: "Optional, e.g., v1.0.0"
            required: true
            source:
              url: "/harbor-artifacts?instance=prod&project=${project}&repo=${service}"
              sendOn: "data.project && data.service"
              initFetch: false
            initFetchOn: "this.project && this.service"
            resetValue: ""
            clearable: true
          - type: "hidden"
            name: "DRY_RUN"
            value: "false"
          - type: "input-text"
            name: "comment"
            label: "Comment"
            required: true
            placeholder: "e.g., why are you deploying this version?"

