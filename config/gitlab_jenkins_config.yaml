# GitLab to Jenkins Generic Webhook Trigger mapping configuration
# This file maps GitLab project paths to Jenkins job configurations

# =============================================================================
# Global Jenkins Configuration
# =============================================================================
jenkins_base_url: "https://jenkins-dev1.exodushk.com"  # Jenkins server URL
jenkins_default_token: ""  # Default trigger token (used when mapping has no token)

# =============================================================================
# Predefined Fields (automatically extracted from GitLab payload)
# =============================================================================
#
# Push Event Fields:
#   - event_name            : Event name (push)
#   - git_http_url          : Git HTTP clone URL
#   - git_ssh_url           : Git SSH clone URL
#   - ref                   : Original ref (e.g., refs/heads/main)
#   - branch                : Branch name extracted from ref
#   - commit_sha            : Latest commit SHA (after)
#   - commit_title          : Last commit title (first line of message)
#   - commit_message        : Last commit message
#   - checkout_sha          : Checkout SHA
#   - user_username         : User username
#   - first_commit_title    : First commit title
#   - last_commit_title     : Last commit title
#   - first_commit_message  : First commit message
#   - last_commit_message   : Last commit message
#   - first_commit_sha      : First commit SHA
#   - last_commit_sha       : Last commit SHA
#
# Tag Push Event Fields (reserved):
#   - ref                   : Original ref (e.g., refs/tags/v1.0.0)
#   - tag_name              : Tag name extracted from ref
#   - before                : Commit SHA before (0000... for new tag)
#   - after                 : Commit SHA after (0000... for deleted tag)
#   - checkout_sha          : Checkout SHA
#   - project_id            : Project ID
#   - project_name          : Project name
#   - project_path          : Project path with namespace
#   - project_url           : Project web URL
#   - user_id               : User ID
#   - user_name             : User name
#   - user_username         : User username
#
# Merge Request Event Fields (reserved):
#   - mr_id                 : Merge request ID
#   - mr_iid                : Merge request IID (project-specific)
#   - mr_title              : Merge request title
#   - mr_state              : Merge request state (opened, closed, merged)
#   - mr_action             : Action that triggered the event
#   - source_branch         : Source branch name
#   - target_branch         : Target branch name
#   - source_project_id     : Source project ID
#   - target_project_id     : Target project ID
#   - project_id            : Target project ID
#   - project_name          : Project name
#   - project_path          : Project path with namespace
#   - project_url           : Project web URL
#   - user_id               : User ID
#   - user_name             : User name
#   - user_username         : User username
#
# =============================================================================

# Project-specific mappings
# Key: GitLab project path (supports wildcard patterns like "group/*")
mappings:
  "mygroup/my-project":
    jenkins_job: "my-build-job"
    jenkins_token: "your-jenkins-token"
  "exodus-server/contract2":
    jenkins_job: "my-build-job"
    jenkins_token: "your-jenkins-token"
  "exodus-server/contract":
    jenkins_job: "pipelines/pipeline-k8s-image-build"
    jenkins_token: "pipeline-k8s-agent-trigger-token1"
  "*":
    jenkins_job: "generic-build"
    jenkins_token: "generic-token"
    commit_title_keywords:
      - "build:yes"

  # Example 1: Send all predefined fields (default behavior)
  # "mygroup/myproject":
  #   jenkins_job: "my-build-job"
  #   jenkins_token: "my-trigger-token"

  # Example 2: Only send specific fields using include_fields
  # "mygroup/another-project":
  #   jenkins_job: "another-job"
  #   jenkins_token: "another-token"
  #   include_fields:
  #     - branch
  #     - commit_sha
  #     - commit_title
  #     - last_commit_message
  #     - user_username

  # Example 3: Wildcard pattern (matches all projects under 'devops/')
  # "devops/*":
  #   jenkins_job: "devops-generic-build"
  #   jenkins_token: "devops-token"
  #   include_fields:
  #     - branch
  #     - git_http_url
  #     - commit_sha
  #     - checkout_sha
  #   extra_params:
  #     build_type: "auto"

  # Example 4: Add extra static parameters
  # "frontend/*":
  #   jenkins_job: "frontend-build"
  #   jenkins_token: "frontend-token"
  #   extra_params:
  #     environment: "staging"
  #     notify_slack: "true"

  # Example 5: Filter by commit_title keywords (simple list, case-insensitive)
  # "backend/*":
  #   jenkins_job: "backend-build"
  #   jenkins_token: "backend-token"
  #   commit_title_keywords:
  #     - "build:yes"
  #     - "[deploy]"
  #     - "[ci]"

  # Example 6: Filter by commit_title keywords (with case-sensitive option)
  # "release/*":
  #   jenkins_job: "release-build"
  #   jenkins_token: "release-token"
  #   commit_title_keywords:
  #     keywords:
  #       - "RELEASE"
  #       - "DEPLOY"
  #     case_sensitive: true

  # Example 7: Match all projects with keyword filter
  # "*":
  #   jenkins_job: "generic-build"
  #   jenkins_token: "generic-token"
  #   commit_title_keywords:
  #     - "[jenkins]"
  #     - "build:yes"

  # Example 8: Override jenkins_base_url for specific project (use different Jenkins server)
  # "special-team/*":
  #   jenkins_base_url: "https://jenkins-prod.example.com"  # Override global jenkins_base_url
  #   jenkins_job: "special-build"
  #   jenkins_token: "special-token"

# Default configuration (used when no pattern matches)
# Set enabled: true to forward unmatched projects to a default job
default:
  enabled: false
  jenkins_job: "default-job"
  jenkins_token: ""
  # Optionally limit fields for default handling
  # include_fields:
  #   - branch
  #   - git_http_url
  #   - commit_sha
  #   - user_username
  # Optionally filter by commit_title keywords
  # commit_title_keywords:
  #   - "[build]"
  #   - "[ci]"
