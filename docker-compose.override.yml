# Development override for docker-compose
# This file is automatically loaded by docker-compose and provides development-specific configuration

services:
  webhook-proxy:
    # Override the command to use reload mode for development
    command:
      [
        "uvicorn",
        "app.main:app",
        "--reload",
      ]

    # Mount source code for live reload
    volumes:
      - ./app:/app/app:ro
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro

    # Additional environment variables for development
    environment:
      - LOG_LEVEL=INFO
      - DATABASE_ECHO=true
      - ENABLE_DATABASE_LOGGING=true
      - ENABLE_CONSOLE_LOGGING=true
      - LOG_TO_FILE=false

  redis:
    # Expose Redis port for external connections during development
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
