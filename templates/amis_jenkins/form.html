<!DOCTYPE html>
<html>

<head>
  <title>{{ page_name }} - Webhook Proxy</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/resource/image/favicon.ico" type="image/x-icon">

  <!-- Amis SDK CSS -->
  <link rel="stylesheet" href="/static/plugin/amis-6.13.0/sdk.css" />
  <link rel="stylesheet" href="/static/plugin/amis-6.13.0/helper.css" />
  <link rel="stylesheet" href="/static/plugin/amis-6.13.0/iconfont.css" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .page-header {
      background: #f5f5f5;
      padding: 12px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-header .title {
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }

    .page-header .back-link {
      color: #1890ff;
      text-decoration: none;
      font-size: 14px;
    }

    .page-header .back-link:hover {
      text-decoration: underline;
    }

    .page-header .description {
      color: #666;
      font-size: 13px;
      margin-left: 16px;
    }

    #amis-root {
      height: calc(100vh - 50px);
      overflow: auto;
    }
  </style>
</head>

<body>
  <!-- Page Header -->
  <div class="page-header">
    <div style="display: flex; align-items: center;">
      <a href="/amis-jenkins/forms" class="back-link">
        &larr; Back to Forms
      </a>
      <span class="description">{{ form_description }}</span>
    </div>
    <div>
      <span style="color: #666; font-size: 13px;">Logged in as: {{ current_user.username }}</span>
    </div>
  </div>

  <!-- Amis Container -->
  <div id="amis-root"></div>

  <!-- Amis SDK JS -->
  <script src="/static/plugin/amis-6.13.0/sdk.js"></script>

  <script type="text/javascript">
    (function () {
      // Get Amis embed function
      let amis = amisRequire('amis/embed');

      // Form schema from backend
      let schema = {{ form_schema | safe
    }};

    // Embed Amis form
    let amisInstance = amis.embed(
      '#amis-root',
      schema,
      {
        // Initial data (if any)
        data: {}
      },
      {
        // Amis environment config
        theme: 'cxd',  // Use cxd theme (default modern theme)
        locale: 'zh-CN',

        // Custom fetcher to handle authentication
        fetcher: ({
          url,
          method,
          data,
          config,
          headers
        }) => {
          config = config || {};
          config.headers = config.headers || headers || {};
          config.withCredentials = true;  // Send cookies for session auth

          if (method === 'get' || method === 'GET') {
            return axios.get(url, config);
          } else if (method === 'post' || method === 'POST') {
            return axios.post(url, data, config);
          } else if (method === 'put' || method === 'PUT') {
            return axios.put(url, data, config);
          } else if (method === 'delete' || method === 'DELETE') {
            return axios.delete(url, config);
          }

          return axios(config);
        },

        // Notification handler
        notify: (type, msg) => {
          if (type === 'error') {
            console.error('[Amis Error]', msg);
            alert('Error: ' + msg);
          } else if (type === 'success') {
            console.log('[Amis Success]', msg);
          }
        },

        // Alert handler
        alert: (msg) => {
          alert(msg);
        },

        // Confirm handler
        confirm: (msg) => {
          return confirm(msg);
        }
      }
    );
    }) ();
  </script>

</body>

</html>
