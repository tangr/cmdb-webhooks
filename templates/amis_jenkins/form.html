{% include "base_head.html" %}

<!-- Amis SDK CSS -->
<link rel="stylesheet" href="/static/plugin/amis-6.13.0/sdk.css" />
<link rel="stylesheet" href="/static/plugin/amis-6.13.0/helper.css" />
<link rel="stylesheet" href="/static/plugin/amis-6.13.0/iconfont.css" />

<style>
  /* Override Amis default styles to match base layout */
  .wrapper {
    padding: 0 !important;
  }

  #amis-root {
    min-height: 400px;
  }

  .loading-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    color: #666;
  }
</style>

<body>
  <div class="wrapper">
    <div class="ui container maincontainer">

      {% include "base_menu.html" %}

      <div class="ui breadcrumb">
        <a class="section" href="/dashboard">Dashboard</a>
        <div class="divider"> / </div>
        <a class="section" href="/amis-jenkins/forms">Amis Jenkins Forms</a>
        <div class="divider"> / </div>
        <div class="active section">{{ form_title }}</div>
      </div>

      <!-- Page Header -->
      <div class="ui segment">
        <h3 class="ui header">
          <i class="wpforms icon"></i>
          <div class="content">
            {{ form_title }}
            <div class="sub header">{{ form_description or 'Fill in the form and submit to trigger Jenkins build' }}
            </div>
          </div>
        </h3>
      </div>

      <!-- Amis Form Container -->
      <div class="ui segment">
        <div id="amis-root">
          <div class="loading-container">Loading form...</div>
        </div>
      </div>

      <!-- Store form_id in data attribute -->
      <div id="form-config" data-form-id="{{ form_id }}" style="display: none;"></div>

    </div>

    {% include "base_foot.html" %}
  </div>

  <!-- Amis SDK JS -->
  <script src="/static/plugin/amis-6.13.0/sdk.js"></script>

  <script type="text/javascript">
    $(document).ready(function () {
      $(".ui.dropdown").dropdown();
    });

    function logout() {
      fetch("/auth/logout", { method: "POST" })
        .then(function (response) {
          window.location.href = "/login";
        })
        .catch(function (error) {
          window.location.href = "/login";
        });
    }

    // Initialize Amis form
    (function () {
      var formId = document.getElementById("form-config").dataset.formId;
      var amis = amisRequire("amis/embed");

      fetch("/amis-jenkins/api/schema/" + formId, { credentials: "include" })
        .then(function (response) {
          return response.json();
        })
        .then(function (result) {
          if (result.status !== 0) {
            document.getElementById("amis-root").innerHTML =
              '<div class="loading-container">Error: ' + result.msg + "</div>";
            return;
          }

          amis.embed(
            "#amis-root",
            result.data,
            { data: {} },
            {
              theme: "cxd",
              locale: "zh-CN",
              fetcher: function (options) {
                var method = (options.method || "GET").toUpperCase();
                var headers = Object.assign({}, options.headers || {});
                var fetchOptions = {
                  method: method,
                  headers: headers,
                  credentials: "include"
                };

                if (method !== "GET" && method !== "HEAD" && options.data) {
                  if (typeof options.data === "object") {
                    headers["Content-Type"] = "application/json";
                    fetchOptions.body = JSON.stringify(options.data);
                  } else {
                    fetchOptions.body = options.data;
                  }
                  fetchOptions.headers = headers;
                }

                return fetch(options.url, fetchOptions)
                  .then(function (response) {
                    return response.json().then(function (data) {
                      return {
                        status: response.status,
                        data: data
                      };
                    });
                  });
              },
              notify: function (type, msg) {
                if (type === "error") {
                  console.error("[Amis Error]", msg);
                  alert("Error: " + msg);
                }
              },
              alert: function (msg) {
                alert(msg);
              },
              confirm: function (msg) {
                return confirm(msg);
              }
            }
          );
        })
        .catch(function (error) {
          document.getElementById("amis-root").innerHTML =
            '<div class="loading-container">Failed to load form: ' + error.message + "</div>";
        });
    })();
  </script>

</body>

</html>
