<!DOCTYPE html>
<html>

<head>
  <title>{{ page_name }} - Webhook Proxy</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/resource/image/favicon.ico" type="image/x-icon">

  <!-- Amis SDK CSS -->
  <link rel="stylesheet" href="/static/plugin/amis-6.13.0/sdk.css" />
  <link rel="stylesheet" href="/static/plugin/amis-6.13.0/helper.css" />
  <link rel="stylesheet" href="/static/plugin/amis-6.13.0/iconfont.css" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .page-header {
      background: #f5f5f5;
      padding: 12px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-header .title {
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }

    .page-header .back-link {
      color: #1890ff;
      text-decoration: none;
      font-size: 14px;
    }

    .page-header .back-link:hover {
      text-decoration: underline;
    }

    .page-header .description {
      color: #666;
      font-size: 13px;
      margin-left: 16px;
    }

    #amis-root {
      height: calc(100vh - 50px);
      overflow: auto;
    }

    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      color: #666;
    }
  </style>
</head>

<body>
  <!-- Page Header -->
  <div class="page-header">
    <div style="display: flex; align-items: center;">
      <a href="/amis-jenkins/forms" class="back-link">
        &larr; Back to Forms
      </a>
      <span class="description">{{ form_description }}</span>
    </div>
    <div>
      <span style="color: #666; font-size: 13px;">Logged in as: {{ current_user.username }}</span>
    </div>
  </div>

  <!-- Amis Container -->
  <div id="amis-root">
    <div class="loading-container">Loading form...</div>
  </div>

  <!-- Store form_id in data attribute -->
  <div id="form-config" data-form-id="{{ form_id }}" style="display: none;"></div>

  <!-- Amis SDK JS -->
  <script src="/static/plugin/amis-6.13.0/sdk.js"></script>

  <script type="text/javascript">
    (function () {
      var formId = document.getElementById("form-config").dataset.formId;
      var amis = amisRequire("amis/embed");

      // Fetch schema from API
      fetch("/amis-jenkins/api/schema/" + formId, {
        credentials: "include"
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (result) {
          if (result.status !== 0) {
            document.getElementById("amis-root").innerHTML =
              '<div class="loading-container">Error: ' + result.msg + "</div>";
            return;
          }

          var schema = result.data;

          // Embed Amis form
          amis.embed(
            "#amis-root",
            schema,
            { data: {} },
            {
              theme: "cxd",
              locale: "zh-CN",
              fetcher: function (options) {
                var config = options.config || {};
                config.headers = config.headers || options.headers || {};
                config.withCredentials = true;

                if (options.method === "get" || options.method === "GET") {
                  return axios.get(options.url, config);
                } else if (options.method === "post" || options.method === "POST") {
                  return axios.post(options.url, options.data, config);
                } else if (options.method === "put" || options.method === "PUT") {
                  return axios.put(options.url, options.data, config);
                } else if (options.method === "delete" || options.method === "DELETE") {
                  return axios.delete(options.url, config);
                }
                return axios(config);
              },
              notify: function (type, msg) {
                if (type === "error") {
                  console.error("[Amis Error]", msg);
                  alert("Error: " + msg);
                }
              },
              alert: function (msg) {
                alert(msg);
              },
              confirm: function (msg) {
                return confirm(msg);
              }
            }
          );
        })
        .catch(function (error) {
          document.getElementById("amis-root").innerHTML =
            '<div class="loading-container">Failed to load form: ' + error.message + "</div>";
        });
    })();
  </script>

</body>

</html>
