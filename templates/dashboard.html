{% include "base_head.html" %}

<body>
  <div class="wrapper">
    <div class="ui container maincontainer">

      {% include "base_menu.html" %}

      <div class="ui breadcrumb">
        <a class="section" href="/dashboard">Dashboard</a>
        <div class="divider"> / </div>
        <div class="active section">Welcome {{ current_user.username }}</div>
      </div>

      <!-- User Info Card -->
      <div class="ui segment">
        <div class="ui grid">
          <div class="ten wide column">
            <h3 class="ui header">
              <i class="dashboard icon"></i>
              <div class="content">
                Dashboard
                <div class="sub header">Welcome back, {{ current_user.username }}</div>
              </div>
            </h3>
          </div>
          <div class="six wide column">
            <div class="ui right aligned basic segment">
              <div class="ui mini statistics">
                <div class="statistic">
                  <div class="value">{{ current_user.roles | length }}</div>
                  <div class="label">Roles</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="ui divider"></div>

        <div class="ui labels">
          {% for role in current_user.roles %}
          <div class="ui {% if role == 'admin' %}red{% else %}blue{% endif %} label">
            {{ role }}
          </div>
          {% endfor %}
        </div>
      </div>

    </div>

    {% include "base_foot.html" %}
  </div>

  <script type="text/javascript">

    $(document).ready(function () {
      $('.ui.dropdown').dropdown();
    });

    function logout() {
      fetch('/auth/logout', {
        method: 'POST'
      })
        .then(response => {
          if (response.ok) {
            window.location.href = '/login';
          } else {
            console.error('Logout failed');
          }
        })
        .catch(error => {
          console.error('Logout error:', error);
          // Force redirect even if logout request fails
          window.location.href = '/login';
        });
    }

  </script>

</body>

</html>
